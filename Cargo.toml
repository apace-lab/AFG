[package]
name = "afg"
version = "0.1.0"
edition = "2021"
description = "MUMP overlap detector"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/apace-lab/AFG"
keywords = ["pointer-analysis", "taint-analysis", "mir", "rust", "security"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "afg"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
walkdir = "2"

# Pulls in llvm-sys, which needs a matching real LLVM install (llvm-config on
# PATH) at build time -- unlike every other dependency here. Kept optional
# and off by default so `cargo build`/`cargo test` without --features keeps
# working for anyone without LLVM installed. Pinned to LLVM 18; see
# src/AC_FINDER.md#scanning-real-llvm-ir for how to retarget another version.
llvm-ir = { version = "0.11", features = ["llvm-18"], optional = true }
rustc-demangle = { version = "0.1", optional = true }

[features]
llvm-ir-scan = ["dep:llvm-ir", "dep:rustc-demangle"]

[[bin]]
name = "afg"
path = "src/main.rs"

[[bin]]
name = "find_llm_calls"
path = "src/bin/find_llm_calls.rs"

[[bin]]
name = "find_llm_calls_js"
path = "src/bin/find_llm_calls_js.rs"

[[bin]]
name = "find_llm_calls_all"
path = "src/bin/find_llm_calls_all.rs"

[[bin]]
name = "find_ac_points"
path = "src/bin/find_ac_points.rs"

[[bin]]
name = "find_ac_points_src"
path = "src/bin/find_ac_points_src.rs"

[[bin]]
name = "find_ac_points_js"
path = "src/bin/find_ac_points_js.rs"

[[bin]]
name = "find_ac_points_all"
path = "src/bin/find_ac_points_all.rs"

[[bin]]
name = "find_ac_points_llvm"
path = "src/bin/find_ac_points_llvm.rs"
required-features = ["llvm-ir-scan"]
