[package]
name = "afg"
version = "0.1.0"
edition = "2021"
description = "MUMP overlap detector"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/apace-lab/AFG"
keywords = ["pointer-analysis", "taint-analysis", "mir", "rust", "security"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "afg"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
walkdir = "2"

[[bin]]
name = "afg"
path = "src/main.rs"

[[bin]]
name = "find_llm_calls"
path = "src/bin/find_llm_calls.rs"

[[bin]]
name = "find_llm_calls_js"
path = "src/bin/find_llm_calls_js.rs"

[[bin]]
name = "find_llm_calls_all"
path = "src/bin/find_llm_calls_all.rs"
